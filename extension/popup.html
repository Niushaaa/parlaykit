<!doctype html>
<html><head><meta charset="utf-8"><title>ParlayKit</title>
<style>
  body{margin:0;width:300px;font:13px/1.4 system-ui,sans-serif;background:#0d1014;color:#e8edf2}
  .wrap{padding:14px}
  h1{display:flex;align-items:center;gap:8px;font-size:15px;margin:0 0 4px}
  h1 img{width:26px;height:26px;border-radius:7px}
  p{color:#8a96a3;margin:0 0 12px}
  label{display:block;color:#8a96a3;font-size:11px;margin-bottom:4px}
  input{width:100%;box-sizing:border-box;background:#151a21;border:1px solid #26303b;border-radius:8px;color:#e8edf2;padding:8px}
  button{margin-top:8px;width:100%;padding:8px;border:0;border-radius:8px;background:#d4ff3f;color:#11140a;font-weight:700;cursor:pointer}
  .st{margin-top:10px;font-size:12px;color:#8a96a3}
  .ok{color:#2bd47d}.err{color:#ff5d6c}
  ul{padding-left:16px;color:#8a96a3;margin:8px 0 0}
</style></head>
<body><div class="wrap">
  <h1><img src="icons/48.png" alt="">ParlayKit</h1>
  <p>Open Polymarket (or the demo venue) and tap the <b>Parlay</b> button in the corner.</p>
  <label for="q">Quoter URL</label>
  <input id="q" placeholder="http://127.0.0.1:8787">
  <button id="save">Save &amp; test</button>
  <div class="st" id="st"></div>
  <ul>
    <li>Supported: polymarket.com, demo venue, 1inch (adapter stub)</li>
  </ul>
</div><script src="popup.js"></script></body></html>
